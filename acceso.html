<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Socio PlazaLocal | Panel Único</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --azul: #1E40AF; --oscuro: #1e293b; --gris: #f8fafc; --verde: #22c55e; --rojo: #ef4444; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--gris); margin: 0; padding: 20px; color: var(--oscuro); }
        
        .view { display: none; max-width: 450px; margin: auto; animation: fadeIn 0.4s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .card { background: white; padding: 25px; border-radius: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); border: 1px solid #e2e8f0; }
        .logo-container { text-align: center; margin-bottom: 20px; }
        .yami-icon { background: var(--azul); color: white; width: 50px; height: 50px; border-radius: 12px; display: inline-flex; align-items: center; justify-content: center; font-size: 24px; margin-bottom: 10px; }
        
        h2 { text-align: center; font-size: 1.2rem; margin-bottom: 20px; font-weight: 800; }
        label { font-size: 11px; font-weight: 800; color: #64748b; display: block; margin-top: 15px; text-transform: uppercase; }
        input, textarea, select { width: 100%; padding: 12px; margin-top: 5px; border: 1.5px solid #e2e8f0; border-radius: 10px; box-sizing: border-box; background: #fff; font-size: 14px; outline: none; transition: 0.3s; }
        input:focus { border-color: var(--azul); }

        .btn { width: 100%; padding: 14px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; transition: 0.3s; font-size: 14px; margin-top: 20px; }
        .btn-azul { background: var(--azul); color: white; }
        .btn-logout { background: #fee2e2; color: var(--rojo); padding: 8px 12px; font-size: 11px; font-weight: 800; border-radius: 8px; border: none; cursor: pointer; }

        .prod-card { background: white; padding: 12px; border-radius: 15px; margin-top: 10px; display: flex; gap: 12px; align-items: center; border: 1px solid #e2e8f0; }
        .prod-card img { width: 50px; height: 50px; border-radius: 8px; object-fit: cover; }
        
        #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--oscuro); color: white; padding: 12px 25px; border-radius: 50px; z-index: 9999; display: none; font-size: 13px; }
    </style>
</head>
<body>

<div id="toast"></div>

<div id="view-login" class="view">
    <div class="card">
        <div class="logo-container">
            <div class="yami-icon"><i class="fas fa-store"></i></div>
            <h1 style="font-size: 22px; margin:0;">PlazaLocal</h1>
        </div>
        <h2>Entrar a mi Panel</h2>
        <label>Número de Celular</label>
        <input type="number" id="log-wa" placeholder="Ej: 3001234567">
        <label>Código PIN (4 dígitos)</label>
        <input type="password" id="log-code" maxlength="4" placeholder="****">
        <button class="btn btn-azul" onclick="login()">INGRESAR</button>
        <button class="btn" style="background:none; color:var(--azul); margin-top:10px;" onclick="switchView('view-register')">¿No tienes cuenta? Regístrate</button>
    </div>
</div>

<div id="view-register" class="view">
    <div class="card">
        <h2>Registro de Socio</h2>
        <label>Nombre del Negocio / Marca</label>
        <input type="text" id="reg-tienda" placeholder="Ej: Calzado El Rayo">
        <label>¿Qué ofreces?</label>
        <select id="reg-tipo">
            <option value="Producto">Productos (Ropa, Comida, etc)</option>
            <option value="Servicio">Servicios (Barbería, Técnico, etc)</option>
        </select>
        <label>Celular (WhatsApp)</label>
        <input type="number" id="reg-wa" placeholder="Ej: 3001234567">
        <label>Crea un PIN de 4 dígitos</label>
        <input type="password" id="reg-code" maxlength="4" placeholder="Ej: 1234">
        <button class="btn btn-azul" onclick="registrarSocio()">CREAR MI PERFIL</button>
        <button class="btn" style="background:none; color:var(--azul); margin-top:10px;" onclick="switchView('view-login')">Ya soy socio</button>
    </div>
</div>

<div id="view-vender" class="view">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
        <span id="header-tienda" style="font-weight: 800; font-size: 18px;">Mi Tienda</span>
        <button class="btn-logout" onclick="logout()">SALIR</button>
    </div>

    <div class="card">
        <h2 id="form-title">Publicar</h2>
        <input type="hidden" id="edit-id">
        
        <label>Nombre del Producto/Servicio</label>
        <input type="text" id="p-nombre" placeholder="¿Qué vendes hoy?">
        
        <div style="display: flex; gap: 10px;">
            <div style="flex:1">
                <label>Precio ($)</label>
                <input type="number" id="p-precio" placeholder="0">
            </div>
            <div style="flex:1">
                <label>Barrio</label>
                <input type="text" id="p-barrio" placeholder="Ej: Centro">
            </div>
        </div>
        
        <label>Descripción</label>
        <textarea id="p-desc" rows="2" placeholder="Detalles..."></textarea>
        
        <label>Link de la Foto (ImgBB)</label>
        <input type="text" id="p-url" placeholder="Pega el link directo aquí">
        
        <button id="btn-main" class="btn btn-azul" onclick="guardarProducto()">GUARDAR PUBLICACIÓN</button>
    </div>

    <div id="inventario" style="margin-top: 30px;">
        <h3 style="font-size: 14px; color: var(--oscuro); font-weight: 800; text-align:center;">MIS PUBLICACIONES</h3>
        <div id="lista-productos"></div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
    import { getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, getDocs, query, where, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCbYsQlbj2AF0Fy3Tgn_-0Z8DdyLeUaOq4",
        authDomain: "plaza-local.firebaseapp.com",
        projectId: "plaza-local",
        storageBucket: "plaza-local.firebasestorage.app",
        messagingSenderId: "987126404226",
        appId: "1:987126404226:web:a1127b7b471acb18d6d09b"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    let sesion = JSON.parse(localStorage.getItem('vendedorActual'));

    window.switchView = (id) => {
        document.querySelectorAll('.view').forEach(v => v.style.display = 'none');
        document.getElementById(id).style.display = 'block';
    };

    function notify(text) {
        const t = document.getElementById('toast');
        t.innerText = text; t.style.display = 'block';
        setTimeout(() => t.style.display = 'none', 3000);
    }

    window.logout = () => {
        localStorage.removeItem('vendedorActual');
        location.reload();
    };

    // --- REGISTRO ---
    window.registrarSocio = async () => {
        const tienda = document.getElementById('reg-tienda').value.trim();
        const wa = document.getElementById('reg-wa').value.trim();
        const code = document.getElementById('reg-code').value.trim();
        const tipo = document.getElementById('reg-tipo').value;

        if(!tienda || !wa || !code) return notify("Completa todos los campos");

        try {
            await addDoc(collection(db, "socios"), { nombreTienda: tienda, celular: wa, codigo: code, tipo: tipo });
            sesion = { celular: wa, tienda: tienda, tipo: tipo };
            localStorage.setItem('vendedorActual', JSON.stringify(sesion));
            notify("¡Perfil Creado!");
            initPanel();
        } catch(e) { notify("Error al registrar"); }
    };

    // --- LOGIN ---
    window.login = async () => {
        const wa = document.getElementById('log-wa').value.trim();
        const code = document.getElementById('log-code').value.trim();
        
        const q = query(collection(db, "socios"), where("celular", "==", wa));
        const snap = await getDocs(q);
        let valid = false;
        snap.forEach(d => {
            if(d.data().codigo == code) {
                sesion = { celular: wa, tienda: d.data().nombreTienda, tipo: d.data().tipo };
                localStorage.setItem('vendedorActual', JSON.stringify(sesion));
                valid = true;
            }
        });
        if(valid) initPanel(); else notify("Datos incorrectos");
    };

    function initPanel() {
        switchView('view-vender');
        document.getElementById('header-tienda').innerText = sesion.tienda;
        renderInventario();
    }

    window.guardarProducto = async () => {
        const idEdit = document.getElementById('edit-id').value;
        const img = document.getElementById('p-url').value.trim();
        const btn = document.getElementById('btn-main');

        const datos = {
            nombre: document.getElementById('p-nombre').value,
            precio: Number(document.getElementById('p-precio').value),
            barrio: document.getElementById('p-barrio').value,
            descripcion: document.getElementById('p-desc').value,
            imagen: img,
            waVendedor: sesion.celular,
            nombreTienda: sesion.tienda,
            tipo: sesion.tipo, // Para que aparezca en la página correcta (Prod o Serv)
            fecha: serverTimestamp()
        };

        btn.disabled = true;
        try {
            if(idEdit) await updateDoc(doc(db, "productos", idEdit), datos);
            else await addDoc(collection(db, "productos"), datos);
            notify("¡Publicado!");
            resetForm();
            renderInventario();
        } catch(e) { notify("Error al guardar"); }
        btn.disabled = false;
    };

    async function renderInventario() {
        const q = query(collection(db, "productos"), where("waVendedor", "==", sesion.celular));
        const snap = await getDocs(q);
        const lista = document.getElementById('lista-productos');
        lista.innerHTML = '';
        snap.forEach(d => {
            const p = d.data();
            lista.innerHTML += `
                <div class="prod-card">
                    <img src="${p.imagen}">
                    <div style="flex:1">
                        <b style="font-size:13px;">${p.nombre}</b><br>
                        <small style="color:var(--azul); font-weight:800;">$${p.precio}</small>
                    </div>
                    <button onclick="window.prepararEdit('${d.id}', '${p.nombre}', ${p.precio}, '${p.barrio}', '${p.descripcion}', '${p.imagen}')" style="border:none; background:none; color:var(--azul);"><i class="fas fa-edit"></i></button>
                    <button onclick="window.eliminar('${d.id}')" style="border:none; background:none; color:var(--rojo);"><i class="fas fa-trash"></i></button>
                </div>`;
        });
    }

    window.prepararEdit = (id, n, p, b, d, img) => {
        document.getElementById('edit-id').value = id;
        document.getElementById('p-nombre').value = n;
        document.getElementById('p-precio').value = p;
        document.getElementById('p-barrio').value = b;
        document.getElementById('p-desc').value = d;
        document.getElementById('p-url').value = img;
        document.getElementById('form-title').innerText = "Editando";
        document.getElementById('btn-main').innerText = "ACTUALIZAR";
    };

    window.eliminar = async (id) => {
        if(confirm("¿Borrar publicación?")) {
            await deleteDoc(doc(db, "productos", id));
            renderInventario();
            notify("Eliminado");
        }
    };

    function resetForm() {
        document.getElementById('edit-id').value = '';
        document.getElementById('form-title').innerText = "Publicar";
        document.getElementById('btn-main').innerText = "GUARDAR PUBLICACIÓN";
        document.querySelectorAll('#view-vender input, #view-vender textarea').forEach(i => i.value = '');
    }

    if(sesion) initPanel(); else switchView('view-login');
</script>
</body>
</html>
