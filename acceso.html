<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Comerciantes | PlazaLocal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .tab-active { border-bottom: 3px solid #1E40AF; color: #1E40AF; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col items-center justify-center p-4 font-sans">

    <div class="mb-8 text-center">
        <a href="index.html" class="text-3xl font-extrabold text-blue-800">Plaza<span class="text-green-600">Local</span></a>
        <p class="text-slate-500 text-sm mt-2">Panel para Comerciantes y Emprendedores</p>
    </div>

    <div class="bg-white rounded-2xl shadow-xl w-full max-w-md border border-slate-100 overflow-hidden">
        
        <div class="flex border-b border-slate-100">
            <button id="tab-login" onclick="cambiarTab('login')" class="flex-1 py-4 font-bold text-slate-400 transition tab-active">
                Ingresar
            </button>
            <button id="tab-registro" onclick="cambiarTab('registro')" class="flex-1 py-4 font-bold text-slate-400 transition">
                Registrarse
            </button>
        </div>

        <div class="p-8">
            <form id="form-login" class="space-y-4">
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-1">Número de Celular</label>
                    <input type="tel" id="login-celular" required placeholder="3001234567" 
                           class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-4 focus:ring-blue-100 outline-none transition">
                </div>
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-1">Contraseña</label>
                    <input type="password" id="login-password" required placeholder="••••••••" 
                           class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-4 focus:ring-blue-100 outline-none transition">
                </div>
                <button type="submit" class="w-full bg-blue-800 text-white py-3 rounded-xl font-bold hover:bg-blue-900 transition shadow-lg">
                    Entrar a mi Panel
                </button>
            </form>

            <form id="form-registro" class="space-y-4 hidden">
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-1">Nombre de Marca o Negocio</label>
                    <input type="text" id="reg-nombre" required placeholder="Ej: Calzado Real"
                           class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-4 focus:ring-blue-100 outline-none transition">
                </div>
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-1">Número de Celular</label>
                    <input type="tel" id="reg-celular" required placeholder="3001234567" 
                           class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-4 focus:ring-blue-100 outline-none transition">
                </div>
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-1">Crea una Contraseña</label>
                    <input type="password" id="reg-password" required placeholder="Mínimo 6 caracteres"
                           class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-4 focus:ring-blue-100 outline-none transition">
                </div>
                <button type="submit" class="w-full bg-green-600 text-white py-3 rounded-xl font-bold hover:bg-green-700 transition shadow-lg">
                    Crear mi Cuenta
                </button>
            </form>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";
        import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCbYsQlbj2AF0Fy3Tgn_-0Z8DdyLeUaOq4",
            authDomain: "plaza-local.firebaseapp.com",
            projectId: "plaza-local",
            storageBucket: "plaza-local.firebasestorage.app",
            messagingSenderId: "987126404226",
            appId: "1:987126404226:web:a1127b7b471acb18d6d09b"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // --- LÓGICA DE PESTAÑAS (UI) ---
        window.cambiarTab = function(tipo) {
            const formLogin = document.getElementById('form-login');
            const formReg = document.getElementById('form-registro');
            const tabLogin = document.getElementById('tab-login');
            const tabReg = document.getElementById('tab-registro');

            if (tipo === 'login') {
                formLogin.classList.remove('hidden');
                formReg.classList.add('hidden');
                tabLogin.classList.add('tab-active');
                tabReg.classList.remove('tab-active');
            } else {
                formLogin.classList.add('hidden');
                formReg.classList.remove('hidden');
                tabReg.classList.add('tab-active');
                tabLogin.classList.remove('tab-active');
            }
        }

        // --- LÓGICA DE REGISTRO ---
        document.getElementById('form-registro').addEventListener('submit', async (e) => {
            e.preventDefault();
            const nombre = document.getElementById('reg-nombre').value;
            const celular = document.getElementById('reg-celular').value;
            const pass = document.getElementById('reg-password').value;
            const fakeEmail = `${celular}@plazalocal.com`;

            try {
                const cred = await createUserWithEmailAndPassword(auth, fakeEmail, pass);
                await setDoc(doc(db, "comercios", cred.user.uid), {
                    uid: cred.user.uid,
                    nombre: nombre,
                    whatsapp: "57" + celular,
                    tipo: "Producto",
                    barrio: "",
                    descripcion: "¡Nuevo negocio!",
                    imagenUrl: "https://via.placeholder.com/400x250?text=Imagen+Negocio",
                    esPremium: false
                });
                window.location.href = 'panel.html';
            } catch (err) { alert("Error al registrar: " + err.message); }
        });

        // --- LÓGICA DE LOGIN ---
        document.getElementById('form-login').addEventListener('submit', async (e) => {
            e.preventDefault();
            const celular = document.getElementById('login-celular').value;
            const pass = document.getElementById('login-password').value;
            const fakeEmail = `${celular}@plazalocal.com`;

            try {
                await signInWithEmailAndPassword(auth, fakeEmail, pass);
                window.location.href = 'panel.html';
            } catch (err) { alert("Datos incorrectos o el usuario no existe."); }
        });

    </script>
</body>
</html>
